name: Hub CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    integrity-and-quality:
        name: 🏛️ Hub Integrity & Quality Gates
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Hub Repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Initialize Public Submodules
              run: |
                  echo "🔍 Synchronizing submodules..."
                  git submodule sync --recursive
                  echo "📦 Initializing accessible submodules..."
                  git submodule update --init --recursive || echo "⚠️ Notice: Some private submodules were skipped (no SSH key provided in CI)."

            - name: Validate Git Submodules Status
              run: |
                  echo "📊 Submodules status:"
                  git submodule status

            - name: Validate Shell Scripts Syntax
              run: |
                  echo "🐚 Validating shell scripts syntax..."
                  if [ -n "$(find . -name "*.sh" -not -path "*/.git/*" -print -quit 2>/dev/null)" ]; then
                    find . -name "*.sh" -not -path "*/.git/*" -exec sh -n {} +
                  fi
                  echo "✅ Shell scripts syntax valid!"

            - name: Validate Markdown Formatting
              run: |
                  echo "📝 Validating Markdown with Prettier..."
                  npx prettier --check "*.md"
                  echo "✅ Markdown formatting valid!"
